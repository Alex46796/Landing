<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Revolution Print Platform — MVP</title>

  <style>
    :root{
      /* Палитра (photo2: 1,3,5) */
      --chestnut:#480903;
      --desert:#E5D1A4;
      --copper:#864B12;

      --bg:#f6f4ef;
      --panel:#ffffff;
      --text:#1c1c1c;
      --muted:#6d6d6d;
      --line:rgba(0,0,0,.08);

      --r-xl:24px;
      --r-lg:18px;
      --r-md:14px;
      --r-sm:10px;

      --shadow:0 12px 30px rgba(0,0,0,.10);
      --shadow-soft:0 8px 22px rgba(0,0,0,.08);

      --g-xl:28px;
      --g-lg:20px;
      --g-md:14px;
      --g-sm:10px;

      --ease:180ms ease;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    /* Layout */
    .app{
      min-height:100vh;
      display:grid;
      grid-template-columns:280px 1fr;
    }

    .sidebar{
      background:var(--panel);
      box-shadow:var(--shadow-soft);
      padding:var(--g-xl) var(--g-lg);
      display:flex;
      flex-direction:column;
      gap:var(--g-xl);
      position:sticky;
      top:0;
      height:100vh;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
    }
    .brand-badge{
      width:44px;height:44px;border-radius:14px;
      background:linear-gradient(135deg,var(--chestnut),var(--copper));
      box-shadow:var(--shadow-soft);
    }
    .brand-title{
      display:flex;flex-direction:column;line-height:1.05;
    }
    .brand-title b{font-size:14px}
    .brand-title span{font-size:12px;color:var(--muted)}

    .nav{
      display:flex;flex-direction:column;gap:8px;
    }
    .nav button{
      all:unset;
      cursor:pointer;
      padding:12px 14px;
      border-radius:14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      transition:var(--ease);
      border:1px solid transparent;
    }
    .nav button:hover{background:rgba(229,209,164,.45)}
    .nav button.active{
      background:rgba(229,209,164,.65);
      border-color:rgba(134,75,18,.25);
    }
    .nav .left{
      display:flex;align-items:center;gap:10px;
      font-size:13px;
    }
    .dot{
      width:10px;height:10px;border-radius:50%;
      background:var(--copper);
      box-shadow:0 0 0 4px rgba(134,75,18,.10);
    }
    .badge{
      font-size:12px;color:var(--muted);
      background:rgba(0,0,0,.04);
      border:1px solid var(--line);
      padding:4px 8px;border-radius:999px;
    }

    .sidebar-footer{
      margin-top:auto;
      display:flex;
      gap:12px;
      align-items:center;
      padding:12px;
      border-radius:18px;
      border:1px solid var(--line);
      background:rgba(0,0,0,.02);
    }
    .avatar{
      width:42px;height:42px;border-radius:50%;
      background:linear-gradient(135deg,var(--desert),rgba(72,9,3,.25));
      border:1px solid rgba(0,0,0,.08);
    }
    .who{display:flex;flex-direction:column;gap:2px}
    .who b{font-size:13px}
    .who span{font-size:12px;color:var(--muted)}

    .main{
      display:flex;
      flex-direction:column;
      min-width:0;
    }

    .topbar{
      height:74px;
      background:var(--panel);
      box-shadow:var(--shadow-soft);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 var(--g-xl);
      position:sticky;
      top:0;
      z-index:10;
    }
    .topbar h1{
      font-size:16px;
      font-weight:650;
      letter-spacing:.2px;
    }
    .topbar small{display:block;color:var(--muted);font-weight:500;margin-top:2px}
    .top-actions{display:flex;gap:10px;align-items:center}
    .icon-btn{
      width:42px;height:42px;border-radius:50%;
      border:1px solid var(--line);
      background:rgba(0,0,0,.03);
      cursor:pointer;
      transition:var(--ease);
      display:grid;place-items:center;
      user-select:none;
    }
    .icon-btn:hover{background:rgba(229,209,164,.55)}
    .pill{
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(0,0,0,.03);
      padding:9px 12px;
      font-size:12px;
      color:var(--muted);
    }

    .content{
      padding:var(--g-xl);
      display:flex;
      flex-direction:column;
      gap:var(--g-xl);
      min-width:0;
    }

    /* Cards */
    .grid{
      display:grid;
      grid-template-columns:repeat(12,1fr);
      gap:var(--g-lg);
      min-width:0;
    }
    .card{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:var(--r-xl);
      box-shadow:var(--shadow);
      padding:var(--g-lg);
      min-width:0;
    }
    .card.soft{
      box-shadow:var(--shadow-soft);
    }
    .card h2{
      font-size:16px;
      margin-bottom:6px;
      font-weight:700;
    }
    .card p{color:var(--muted);font-size:13px}

    .card-header{
      display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
      margin-bottom:14px;
    }
    .subtle{
      color:var(--muted);font-size:12px;
    }

    .btn{
      border:none;
      cursor:pointer;
      transition:var(--ease);
      font-family:inherit;
      border-radius:14px;
      padding:11px 14px;
      font-weight:650;
      font-size:13px;
      user-select:none;
    }
    .btn.primary{
      background:var(--chestnut);
      color:#fff;
      box-shadow:var(--shadow-soft);
    }
    .btn.primary:hover{transform:translateY(-1px);opacity:.95}
    .btn.ghost{
      background:rgba(0,0,0,.03);
      border:1px solid var(--line);
      color:var(--text);
    }
    .btn.ghost:hover{background:rgba(229,209,164,.55)}
    .btn.danger{
      background:var(--chestnut);
      color:#fff;
    }
    .btn:disabled{
      opacity:.55;cursor:not-allowed;transform:none !important;
    }

    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .row.space{justify-content:space-between}

    .field{
      display:flex;flex-direction:column;gap:6px;
      min-width:180px;
    }
    label{font-size:12px;color:var(--muted);font-weight:600}
    input, select, textarea{
      border:1px solid var(--line);
      background:rgba(0,0,0,.02);
      border-radius:14px;
      padding:11px 12px;
      font-size:13px;
      outline:none;
      transition:var(--ease);
      font-family:inherit;
    }
    textarea{min-height:92px;resize:vertical}
    input:focus, select:focus, textarea:focus{
      border-color:rgba(134,75,18,.45);
      box-shadow:0 0 0 4px rgba(134,75,18,.10);
      background:#fff;
    }

    .table{
      width:100%;
      border-collapse:separate;
      border-spacing:0 10px;
    }
    .table th{
      text-align:left;
      font-size:12px;
      color:var(--muted);
      padding:0 10px 6px 10px;
      font-weight:700;
    }
    .table td{
      padding:12px 10px;
      background:rgba(0,0,0,.02);
      border-top:1px solid var(--line);
      border-bottom:1px solid var(--line);
      font-size:13px;
      vertical-align:top;
    }
    .table tr td:first-child{
      border-left:1px solid var(--line);
      border-top-left-radius:14px;border-bottom-left-radius:14px;
    }
    .table tr td:last-child{
      border-right:1px solid var(--line);
      border-top-right-radius:14px;border-bottom-right-radius:14px;
    }

    .status{
      padding:5px 9px;border-radius:999px;
      border:1px solid var(--line);
      font-size:12px;
      display:inline-flex;align-items:center;gap:6px;
      background:#fff;
    }
    .status i{
      width:8px;height:8px;border-radius:50%;display:inline-block;
      background:var(--copper);
    }

    .empty{
      padding:44px;
      text-align:center;
      border:1px dashed rgba(0,0,0,.16);
      border-radius:var(--r-xl);
      background:rgba(229,209,164,.25);
      color:var(--muted);
    }

    /* Floating chat */
    .chat-fab{
      position:fixed;
      right:26px;bottom:26px;
      width:64px;height:64px;border-radius:50%;
      background:var(--chestnut);
      color:#fff;
      border:none;
      cursor:pointer;
      box-shadow:var(--shadow);
      display:grid;place-items:center;
      transition:var(--ease);
      z-index:30;
    }
    .chat-fab:hover{transform:scale(1.05)}
    .chat-fab small{display:block;font-size:10px;opacity:.9;margin-top:-2px}

    /* Margin button + fireworks */
    .margin-btn{
      width:70px;height:70px;border-radius:50%;
      background:var(--chestnut);
      color:#fff;
      border:none;
      cursor:pointer;
      box-shadow:var(--shadow);
      transition:var(--ease);
      display:grid;place-items:center;
      font-weight:800;
      letter-spacing:.2px;
    }
    .margin-btn:hover{transform:scale(1.08)}
    .fireworks{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:999;
    }

    /* Modal */
    .modal-backdrop{
      position:fixed;inset:0;
      background:rgba(0,0,0,.35);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:200;
      padding:20px;
    }
    .modal{
      width:min(860px, 100%);
      background:var(--panel);
      border-radius:var(--r-xl);
      border:1px solid rgba(255,255,255,.25);
      box-shadow:0 20px 70px rgba(0,0,0,.35);
      padding:18px;
      max-height:80vh;
      overflow:auto;
    }
    .modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .modal-head b{font-size:14px}
    .close-x{
      width:42px;height:42px;border-radius:50%;
      border:1px solid var(--line);
      background:rgba(0,0,0,.03);
      cursor:pointer;
    }

    /* Toast */
    .toast{
      position:fixed;
      left:50%;top:18px;
      transform:translateX(-50%);
      background:rgba(255,255,255,.95);
      border:1px solid var(--line);
      border-radius:999px;
      padding:10px 14px;
      box-shadow:var(--shadow-soft);
      display:none;
      z-index:300;
      font-size:13px;
      color:var(--text);
      gap:10px;align-items:center;
    }

    /* Print (PDF) look */
    @media print{
      .sidebar,.topbar,.chat-fab,.toast,.modal-backdrop{display:none !important}
      .content{padding:0}
      .card{box-shadow:none;border:1px solid #ddd}
      body{background:#fff}
    }
  </style>
</head>

<body>
  <div class="toast" id="toast"></div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modal">
      <div class="modal-head">
        <b id="modalTitle">Окно</b>
        <button class="close-x" id="modalClose">×</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <canvas class="fireworks" id="fireworks"></canvas>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-badge"></div>
        <div class="brand-title">
          <b>Revolution Print</b>
          <span>Internal Platform (MVP)</span>
        </div>
      </div>

      <nav class="nav" id="nav">
        <!-- buttons injected -->
      </nav>

      <div class="sidebar-footer">
        <div class="avatar"></div>
        <div class="who">
          <b id="whoName">—</b>
          <span id="whoRole">—</span>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div>
          <h1 id="topTitle">Главная</h1>
          <small id="topSub">Рабочее пространство</small>
        </div>

        <div class="top-actions">
          <div class="pill" id="presencePill">В системе: 0м</div>
          <button class="icon-btn" id="btnNotif" title="Уведомления">🔔</button>
          <button class="icon-btn" id="btnProfile" title="Личный кабинет">👤</button>
        </div>
      </header>

      <div class="content" id="content">
        <!-- pages render here -->
      </div>
    </div>
  </div>

  <button class="chat-fab" id="fabChat" title="Открыть чат">
    <small>Чат</small>
  </button>

  <script>
    /******************************************************************
     *  Revolution Print Platform — One-file MVP
     *  Всё сохраняется в localStorage.
     ******************************************************************/

    const LS_KEY = "rp_platform_mvp_v1";

    const NAV = [
      { id:"dashboard", title:"Главная", subtitle:"7 разделов и быстрые переходы" },
      { id:"calculator", title:"Калькулятор DTF", subtitle:"Расчёт стоимости + маржа" },
      { id:"documents", title:"Документы", subtitle:"КП / сметы / акты / экспорт" },
      { id:"chat", title:"Чат", subtitle:"Сообщения + файлы + привязка" },
      { id:"production", title:"Производство", subtitle:"Компании и условия сотрудничества" },
      { id:"clients", title:"Клиенты", subtitle:"Статусы, звонки, ответственность" },
      { id:"orders", title:"Заказы", subtitle:"Жизненный цикл заказа" },
      { id:"kp", title:"Создание документов", subtitle:"КП / смета / акт по ГОСТ" },
      { id:"admin", title:"Админка", subtitle:"Сотрудники, роли, контроль времени" },
      { id:"profile", title:"Личный кабинет", subtitle:"Профиль и статистика" },
    ];

    const ROLE_LABELS = {
      admin:"Администратор",
      manager:"Менеджер продаж",
      production:"Производство",
      owner:"Руководитель",
      partner:"Партнёр",
      pm:"PM",
      dev:"Разработчик"
    };

    // ---------- State ----------
    function defaultState(){
      const now = Date.now();
      return {
        app: { page:"dashboard", startedAt: now, lastActiveAt: now },
        user: { id:1, fullName:"Иван Иванов", role:"manager", email:"ivan@revolutionprint.local" },

        notifications: [
          { id: 1, text: "Платформа запущена (MVP).", at: now }
        ],

        clients: [
          { id: 101, name:"ООО Ромашка", status:"Новый", owner:null, firstCall:null, lastCall:null, comment:"", createdAt: now },
          { id: 102, name:"ИП Соколова", status:"Ожидании", owner:"Пётр Петров", firstCall:now-86400000*2, lastCall:now-86400000, comment:"Ждёт КП", createdAt: now-86400000*5 }
        ],

        orders: [
          { id: 201, clientId: 102, title:"DTF перенос (10 шт)", status:"Ожидании", createdAt: now-86400000*2, note:"Клиент думает" }
        ],

        productionCompanies: [
          { id: 301, name:"RP In-house", info:"Внутреннее производство", cooperation:"Собственное", createdAt: now-86400000*30 }
        ],

        chat: {
          messages: [
            { id: 1, type:"system", user:"Система", text:"Добро пожаловать в Revolution Print Platform.", at: now-200000, files:[], link:null },
            { id: 2, type:"user", user:"Иван Иванов", text:"Принял, работаем.", at: now-150000, files:[], link:null },
          ]
        },

        calculator: {
          items: [
            { id:1, width:30, height:20, qty:10, sides:"1", complexity:"Лёгкий" }
          ],
          marginPct: 20
        },

        documents: [
          { id: 401, type:"КП", title:"КП шаблон", createdAt: now-86400000*10, content: "Коммерческое предложение (шаблон)." }
        ],

        users: [
          { id:1, fullName:"Иван Иванов", role:"manager", email:"ivan@revolutionprint.local", password:"••••••••", active:true },
          { id:2, fullName:"Пётр Петров", role:"manager", email:"petr@revolutionprint.local", password:"••••••••", active:true },
          { id:3, fullName:"Михаил (owner)", role:"owner", email:"mikhail@revolutionprint.local", password:"••••••••", active:true },
          { id:4, fullName:"Админ", role:"admin", email:"admin@revolutionprint.local", password:"••••••••", active:true }
        ],

        stats: {
          // история действий по пользователю (для личного кабинета)
          activity: [
            { id: 1, userId: 1, at: now-3600000*10, text: "Открыл платформу" },
            { id: 2, userId: 1, at: now-3600000*2, text: "Просмотрел клиентов" }
          ]
        },

        kpEditor: {
          blocks: [
            { id:"b1", title:"Шапка", text:"Revolution Print • Коммерческое предложение" },
            { id:"b2", title:"Реквизиты", text:"ИНН/КПП/Адрес/Контакты" },
            { id:"b3", title:"Список позиций", text:"Позиция 1 • DTF перенос • Кол-во • Цена" },
            { id:"b4", title:"Итог и сроки", text:"Итого: … ₽ • Срок: …" },
            { id:"b5", title:"Условия по ГОСТ", text:"Условия оплаты/поставки/гарантии (ГОСТ-стиль)" }
          ]
        }
      };
    }

    function loadState(){
      try{
        const raw = localStorage.getItem(LS_KEY);
        if(!raw) return defaultState();
        const s = JSON.parse(raw);
        // минимальная «миграция»
        if(!s.app || !s.user) return defaultState();
        return s;
      } catch {
        return defaultState();
      }
    }

    function saveState(){
      localStorage.setItem(LS_KEY, JSON.stringify(state));
    }

    const state = loadState();

    // ---------- Utils ----------
    const $ = (sel, root=document) => root.querySelector(sel);
    const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));

    function fmtDateTime(ts){
      const d = new Date(ts);
      return d.toLocaleString();
    }
    function fmtDate(ts){
      if(!ts) return "—";
      const d = new Date(ts);
      return d.toLocaleDateString();
    }
    function toast(text){
      const t = $("#toast");
      t.style.display = "flex";
      t.textContent = text;
      setTimeout(()=>{ t.style.display="none"; }, 1800);
    }
    function logActivity(text){
      state.stats.activity.unshift({
        id: Date.now(),
        userId: state.user.id,
        at: Date.now(),
        text
      });
      saveState();
    }

    // ---------- Modal ----------
    function openModal(title, html){
      $("#modalTitle").textContent = title;
      $("#modalBody").innerHTML = html;
      $("#modalBackdrop").style.display = "flex";
    }
    function closeModal(){
      $("#modalBackdrop").style.display = "none";
      $("#modalBody").innerHTML = "";
    }
    $("#modalClose").addEventListener("click", closeModal);
    $("#modalBackdrop").addEventListener("click", (e)=>{
      if(e.target.id==="modalBackdrop") closeModal();
    });

    // ---------- Navigation ----------
    function renderNav(){
      const nav = $("#nav");
      nav.innerHTML = NAV.map(item => `
        <button data-page="${item.id}" class="${state.app.page===item.id?'active':''}">
          <span class="left"><span class="dot"></span>${item.title}</span>
          <span class="badge">›</span>
        </button>
      `).join("");

      $$("#nav button").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          go(btn.dataset.page);
        });
      });
    }

    function go(page){
      state.app.page = page;
      state.app.lastActiveAt = Date.now();
      saveState();
      render();
    }

    // ---------- Presence timer ----------
    function updatePresence(){
      const ms = Date.now() - state.app.startedAt;
      const min = Math.floor(ms/60000);
      $("#presencePill").textContent = `В системе: ${min}м`;
      // для админки — фиксируем только время, без лишней записи
      saveState();
    }

    setInterval(updatePresence, 60000);
    updatePresence();

    // ---------- Top buttons ----------
    $("#btnNotif").addEventListener("click", ()=>{
      const items = state.notifications
        .slice(0,20)
        .map(n=>`<div class="chat-message"><b></b> ${n.text}<div class="subtle">${fmtDateTime(n.at)}</div></div>`)
        .join("") || `<div class="empty">Уведомлений пока нет</div>`;
      openModal("Уведомления", items);
      logActivity("Открыл уведомления");
    });

    $("#btnProfile").addEventListener("click", ()=>go("profile"));
    $("#fabChat").addEventListener("click", ()=>go("chat"));

    // ---------- Fireworks (simple particles) ----------
    const fw = $("#fireworks");
    const fwCtx = fw.getContext("2d");
    let particles = [];
    function resizeFW(){
      fw.width = window.innerWidth;
      fw.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeFW);
    resizeFW();

    function launchFireworks(anchorEl){
  // Целим "вокруг кнопки": центрируем по элементу (если есть)
  let cx = window.innerWidth * 0.75;
  let cy = window.innerHeight * 0.75;

  if(anchorEl && anchorEl.getBoundingClientRect){
    const r = anchorEl.getBoundingClientRect();
    cx = r.left + r.width/2;
    cy = r.top + r.height/2;
  }

  for(let i=0;i<160;i++){
    const a = Math.random()*Math.PI*2;
    const sp = 2 + Math.random()*6;
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(a)*sp,
      vy: Math.sin(a)*sp,
      life: 60 + Math.random()*40,
      r: 2 + Math.random()*3,
      c: Math.random()<0.6 ? "rgba(134,75,18,.9)" : "rgba(72,9,3,.9)"
    });
  }
  animateFW();
}
    let fwAnimating = false;
    function animateFW(){
      if(fwAnimating) return;
      fwAnimating = true;

      const tick = ()=>{
        fwCtx.clearRect(0,0,fw.width,fw.height);
        particles.forEach(p=>{
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.08; // gravity
          p.life -= 1;

          fwCtx.beginPath();
          fwCtx.fillStyle = p.c;
          fwCtx.arc(p.x, p.y, p.r, 0, Math.PI*2);
          fwCtx.fill();
        });

        particles = particles.filter(p=>p.life>0);

        if(particles.length>0){
          requestAnimationFrame(tick);
        } else {
          fwCtx.clearRect(0,0,fw.width,fw.height);
          fwAnimating = false;
        }
      };
      requestAnimationFrame(tick);
    }

    function renderMsg(m){
      const fileInfo = (m.files && m.files.length)
        ? `<div class="subtle"> файлов: ${m.files.length}</div>`
        : "";
      const link = m.link ? `<div class="subtle"> ${escapeHtml(m.link)}</div>` : "";
      return `
        <div class="chat-message">
          <div class="row space">
            <b>${escapeHtml(m.user)}</b>
            <span class="subtle">${fmtDateTime(m.at)}</span>
          </div>
          <div style="margin-top:6px">${escapeHtml(m.text)}</div>
          ${link}
          ${fileInfo}
        </div>
      `;
    }

    // ---------- Binding page events ----------
    function bindPageEvents(page){
      // common: data-go
      $$("[data-go]").forEach(b=>b.addEventListener("click", ()=>go(b.dataset.go)));

      if(page==="dashboard"){
        $$("[data-go]").forEach(b=>b.addEventListener("click", ()=>go(b.dataset.go)));
        $("#btnReset")?.addEventListener("click", ()=>{
          if(confirm("Сбросить данные к исходному MVP состоянию?")){
            localStorage.removeItem(LS_KEY);
            location.reload();
          }
        });
        $$("button[data-go]").forEach(btn=>{
          btn.addEventListener("click", ()=>go(btn.dataset.go));
        });
      }

      if(page==="calculator"){
        $("#btnAddCalcItem")?.addEventListener("click", ()=>{
          state.calculator.items.push({
            id: Date.now(),
            width: 30,
            height: 20,
            qty: 10,
            sides:"1",
            complexity:"Лёгкий"
          });
          saveState();
          render();
          toast("Позиция добавлена");
          logActivity("Добавил позицию в калькуляторе");
        });

        $$("[data-del-calc]").forEach(btn=>{
          btn.addEventListener("click", ()=>{
            const id = Number(btn.dataset.delCalc);
            state.calculator.items = state.calculator.items.filter(x=>x.id!==id);
            saveState();
            render();
            toast("Позиция удалена");
            logActivity("Удалил позицию калькулятора");
          });
        });

        $$("[data-calc]").forEach(inp=>{
          inp.addEventListener("change", ()=>{
            const id = Number(inp.dataset.id);
            const field = inp.dataset.calc;
            const item = state.calculator.items.find(x=>x.id===id);
            if(!item) return;
            item[field] = (inp.tagName==="SELECT") ? inp.value : Number(inp.value || 0);
            saveState();
          });
        });

        $("#btnMargin")?.addEventListener("click", ()=>{
          openModal("Маржа", `
            <div class="row">
              <div class="field">
                <label>Маржа (%)</label>
                <input id="marginInput" type="number" min="0" max="500" value="${state.calculator.marginPct}" />
              </div>
              <button class="btn primary" id="marginApply">Применить</button>
            </div>
            <div class="subtle" style="margin-top:10px">
              Кнопка маржи — красная, круглая, с «фейерверком» (анимация).
            </div>
          `);
          $("#marginApply").addEventListener("click", ()=>{
            const v = Number($("#marginInput").value || 0);
            state.calculator.marginPct = Math.max(0, Math.min(500, v));
            saveState();
            closeModal();
            render();
            toast("Маржа обновлена");
            launchFireworks(document.getElementById('btnMargin'));
            logActivity("Изменил маржу");
          });
        });

        $("#btnCalcTotal")?.addEventListener("click", ()=>{
          const { cost, total } = calcDTF();
          $("#costLabel").textContent = `${cost.toLocaleString()} ₽`;
          $("#totalLabel").textContent = `${total.toLocaleString()} ₽`;
          toast("Рассчитано");
          logActivity("Сделал расчёт DTF");
        });

        $("#btnSaveToOrder")?.addEventListener("click", ()=>{
          const { total } = calcDTF();
          const client = state.clients[0];
          if(!client){
            toast("Сначала создайте клиента");
            return;
          }
          const id = Date.now()%100000;
          state.orders.push({
            id,
            clientId: client.id,
            title: `DTF расчёт (${state.calculator.items.length} поз.)`,
            status: "Обработка",
            createdAt: Date.now(),
            note: `Сумма: ${total} ₽`
          });
          saveState();
          toast("Сохранено как заказ");
          state.notifications.unshift({ id:Date.now(), text:`Создан заказ #${id} из калькулятора`, at:Date.now() });
          saveState();
          logActivity(`Создал заказ #${id} из калькулятора`);
        });

        $("#btnSaveToDoc")?.addEventListener("click", ()=>{
          const { cost, total } = calcDTF();
          const id = Date.now()%100000;
          const content = [
            "Коммерческое предложение (MVP)",
            "",
            `Расчёт DTF: позиций: ${state.calculator.items.length}`,
            `Себестоимость: ${cost} ₽`,
            `Маржа: ${state.calculator.marginPct}%`,
            `Итого: ${total} ₽`,
            "",
            "Revolution Print"
          ].join("\n");
          state.documents.unshift({ id, type:"КП", title:`КП DTF #${id}`, createdAt:Date.now(), content });
          saveState();
          toast("Сохранено в документы");
          logActivity(`Сохранил КП DTF #${id}`);

            state.clients.unshift({

              at:Date.now(),
              files:[],
              link:`client:${id}`

            closeModal();
            render();
            toast("Клиент создан");
            logActivity(`Создал клиента: ${name}`);

        });

        $$("[data-client-status]").forEach(sel=>{
          sel.addEventListener("change", ()=>{
            const id = Number(sel.dataset.clientStatus);

            client.status = sel.value;
            saveState();
            toast("Статус обновлён");
            logActivity(`Изменил статус клиента #${id} на "${sel.value}"`);
          });
        });

        $$("[data-client-calls]").forEach(btn=>{

                <button class="btn ghost" id="cancelCalls">Отмена</button>

              saveState();
              closeModal();
              render();

        $$("[data-client-take]").forEach(btn=>{
          btn.addEventListener("click", ()=>{
            const id = Number(btn.dataset.clientTake);
            const client = state.clients.find(c=>c.id===id);
            if(!client) return;

            if(client.owner){
              toast("Клиент занят, выберите другого");
              return;

            client.owner = state.user.fullName;
            client.status = "В работе";

            state.chat.messages.push({
              id: Date.now(),
              type:"system",
              user:"Система",
              text:`${state.user.fullName} взял клиента "${client.name}" на обработку`,
              at: Date.now(),
              files:[],
              link:`client:${client.id}`

            saveState();
            render();
            toast("Клиент взят");
            logActivity(`Взял клиента "${client.name}"`);
          });
        });

        $$("[data-client-edit]").forEach(btn=>{
          btn.addEventListener("click", ()=>{
            const id = Number(btn.dataset.clientEdit);
            const c = state.clients.find(x=>x.id===id);
            if(!c) return;

            openModal("Карточка клиента", `
              <div class="chat-message">
                <b>${escapeHtml(c.name)}</b>
                <div class="subtle">ID: ${c.id} • Создан: ${fmtDateTime(c.createdAt)}</div>
              </div>
              <div class="row">
                <div class="pill">Статус: <b>${escapeHtml(c.status)}</b></div>
                <div class="pill">Ответственный: <b>${escapeHtml(c.owner || "—")}</b></div>
              </div>
              <div class="chat-message" style="margin-top:10px">
                <b>Комментарий:</b>
                <div style="white-space:pre-wrap">${escapeHtml(c.comment || "—")}</div>
              </div>
              <div class="row" style="margin-top:10px">
                <button class="btn ghost" data-go="orders">Перейти к заказам</button>
                <button class="btn ghost" data-go="chat">Открыть чат</button>
              </div>

            $$("[data-go]").forEach(b=>b.addEventListener("click", ()=>{ closeModal(); go(b.dataset.go); }));
          });
        });

                <label>Клиент</label>
                <select id="newOrderClient">

                </select>
              </div>
              <div class="field">
                <label>Статус</label>
                <select id="newOrderStatus">
                  ${["Обработка","В работе","Готов","Отменен","Ожидании"].map(s=>`<option>${s}</option>`).join("")}
                </select>
              </div>
            </div>
            <div class="field" style="margin-top:10px">

              <textarea id="newOrderNote"></textarea>

              <button class="btn primary" id="createOrder">Создать</button>
              <button class="btn ghost" id="cancelOrder">Отмена</button>

          `);

              user:"Система",
              text:`Создан заказ #${id} для клиента "${(state.clients.find(c=>c.id===clientId)||{}).name || "—"}"`,

              files:[],
              link:`order:${id}`

            saveState();
            closeModal();
            render();

            logActivity(`Создал заказ #${id}`);

        });

            o.status = sel.value;
            state.notifications.unshift({ id:Date.now(), text:`Заказ #${id}: статус → ${sel.value}`, at:Date.now() });

            toast("Статус заказа обновлён");

          });

          btn.addEventListener("click", ()=>{

            $("#saveOrder").addEventListener("click", ()=>{
              o.note = $("#orderNote").value.trim();

              closeModal();
              render();
              toast("Сохранено");
              logActivity(`Обновил заказ #${id}`);
            });

                <input id="prodName" />

    // ---------- Calculator math (MVP) ----------
    function calcDTF(){
      const items = state.calculator.items || [];
      // Упрощённая модель:
      // площадь (м²) = w*h / 10000
      // коэффициенты:
      // sides 2 => *1.25
      // complexity "Сложный" => *1.2
      // базовая ставка: 520 ₽ за м² (условно)
      const basePerM2 = 520;

      let cost = 0;
      for(const it of items){
        const area = (Number(it.width||0) * Number(it.height||0)) / 10000;
        let k = 1;
        if(String(it.sides)==="2") k *= 1.25;
        if(String(it.complexity)==="Сложный") k *= 1.2;
        const line = area * Number(it.qty||0) * basePerM2 * k;
        cost += line;
      }
      cost = Math.round(cost);
      const margin = Number(state.calculator.marginPct||0);
      const total = Math.round(cost * (1 + margin/100));
      return { cost, total };
    }

    // ---------- Exports ----------
    function getDoc(id){
      const d = state.documents.find(x=>x.id===id);
      return d || { title:"Документ", type:"", createdAt:Date.now(), content:"" };
    }

    function exportWord(doc){
      // простая doc-выгрузка: HTML внутри .doc
      const html = `
        <html><head><meta charset="utf-8"></head><body>
        <h2>${escapeHtml(doc.type || "Документ")} — ${escapeHtml(doc.title || "")}</h2>
        <pre style="white-space:pre-wrap;font-family:Arial">${escapeHtml(doc.content || "")}</pre>
        <p style="color:#666;font-size:12px">Сформировано: ${fmtDateTime(doc.createdAt || Date.now())}</p>
        <\/body><\/html>
      `;
      downloadBlob(new Blob([html], {type:"application/msword"}), safeName(`${doc.type||"doc"}_${doc.title||"document"}.doc`));
      toast("Экспорт Word");
    }

    function exportExcel(doc){
      // MVP: CSV (Excel открывает)
      const rows = [
        ["Type", doc.type||""],
        ["Title", doc.title||""],
        ["CreatedAt", new Date(doc.createdAt||Date.now()).toISOString()],
        ["Content", (doc.content||"").replace(/\n/g," \\n ")]
      ];
      const csv = rows.map(r=>r.map(csvCell).join(",")).join("\n");
      downloadBlob(new Blob([csv], {type:"text/csv;charset=utf-8"}), safeName(`${doc.type||"doc"}_${doc.title||"document"}.csv`));
      toast("Экспорт Excel (CSV)");
    }

    function exportPDF(doc){
  // PDF разрешён только для КП
  if(!doc || doc.type!=="КП"){
    toast("PDF экспорт доступен только для КП");
    return;
  }

  const html = `
    <html>
      <head>
        <meta charset="utf-8">
        <title>${escapeHtml(doc.title || "КП")}</title>
        <style>
          body{font-family:"Times New Roman",serif;padding:40px;line-height:1.45;color:#000}
          h2{margin:0 0 14px 0}
          .meta{color:#555;font-size:12px;margin-bottom:14px}
          pre{white-space:pre-wrap;font-size:14px;margin:0}
        </style>
      </head>
      <body>
        <h2>${escapeHtml(doc.type || "КП")} — ${escapeHtml(doc.title || "")}</h2>
        <div class="meta">Сформировано: ${new Date(doc.createdAt || Date.now()).toLocaleString()}</div>
        <pre>${escapeHtml(doc.content || "")}</pre>
      <\/body>
    <\/html>
  `;

  const iframe = document.createElement("iframe");
  iframe.style.position="fixed";
  iframe.style.right="0";
  iframe.style.bottom="0";
  iframe.style.width="0";
  iframe.style.height="0";
  iframe.style.border="0";
  document.body.appendChild(iframe);

  const d = iframe.contentWindow.document;
  d.open();
  d.write(html);
  d.close();

  iframe.onload = ()=>{
    iframe.contentWindow.focus();
    iframe.contentWindow.print();
    setTimeout(()=>iframe.remove(), 1000);
  };
}

    function csvCell(v){
      const s = String(v ?? "");
      const needs = /[",\n]/.test(s);
      const escaped = s.replace(/"/g,'""');
      return needs ? `"${escaped}"` : escaped;
    }

    function downloadBlob(blob, filename){
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 500);
    }
    function safeName(name){
      return name.replace(/[\\/:*?"<>|]+/g, "_").slice(0,120);
    }

    // ---------- KP helpers ----------
    function moveBlock(id, dir){
      const arr = state.kpEditor.blocks;
      const idx = arr.findIndex(b=>b.id===id);
      if(idx<0) return;
      const ni = idx + dir;
      if(ni<0 || ni>=arr.length) return;
      const tmp = arr[idx];
      arr[idx] = arr[ni];
      arr[ni] = tmp;
      saveState();
      render();
      toast("Блок перемещён");
      logActivity("Переместил блок КП");
    }

    // ---------- Date helpers ----------
    function toDateValue(ts){
      if(!ts) return "";
      const d = new Date(ts);
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth()+1).padStart(2,"0");
      const dd = String(d.getDate()).padStart(2,"0");
      return `${yyyy}-${mm}-${dd}`;
    }
    function fromDateValue(v){
      if(!v) return null;
      const [y,m,d] = v.split("-").map(Number);
      if(!y||!m||!d) return null;
      return new Date(y, m-1, d).getTime();
    }

    // ---------- HTML escaping ----------
    function escapeHtml(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    // ---------- Initial render ----------
    render();
    toast("MVP загружен");
    logActivity("Открыл платформу");
  </script>
